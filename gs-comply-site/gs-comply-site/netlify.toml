[build]
  command = "npm run build"
  publish = "dist"

# `npm run build` pre-renders every public page to real HTML (dist/about.html etc.), plus
# sitemap.xml, 404.html (real 404 status for unknown URLs) and 200.html (empty app shell).
#
# Edge functions in netlify/edge-functions/ (only active when VITE_BLOG_ENABLED=true):
#   /insights, /insights/*  -> server-rendered blog HTML
#   /rss.xml, /sitemap.xml  -> generated live from Supabase

# Client-side-only routes use the empty app shell. Everything else that does not exist gets 404.html.
[[redirects]]
  from = "/insights"
  to = "/200.html"
  status = 200

[[redirects]]
  from = "/insights/*"
  to = "/200.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/200.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/200.html"
  status = 200

# Admin pages must never be indexed
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
